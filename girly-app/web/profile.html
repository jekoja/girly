<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Girly  - Profile</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="css/girly.css"/>
</head>
<body>
<main class="page" style="gap:var(--sp-md); max-width:600px">

  <!-- Profile card -->
  <section class="card glow-card stack gap-xs center" style="align-items:center">

    <!-- Cover photo: the banner across the top of the card. The strip itself is
         the control — it holds the picture, or a soft placeholder inviting one —
         so there is no separate button to find. -->
    <div class="cover" id="cover" role="button" tabindex="0" aria-label="Add a cover photo">
      <img id="cover-img" alt="Your cover photo" class="hidden"/>
      <span class="cover-empty" id="cover-empty">
        <span class="material-symbols-outlined" style="font-size:22px">add_photo_alternate</span>
        <span class="t-label-md">Add a cover photo</span>
      </span>
      <span class="cover-edit" aria-hidden="true">
        <span class="material-symbols-outlined" id="cover-edit-icon" style="font-size:16px">add_a_photo</span>
      </span>
    </div>
    <input type="file" id="cover-input" accept="image/png, image/jpeg, image/gif, image/webp" class="hidden"/>

    <div class="profile-avatar" id="profile-avatar" role="button" tabindex="0" aria-label="Change profile picture">
      <img id="avatar-img" alt="Profile picture" class="hidden"/>
      <span id="avatar-initials" class="t-headline-md" style="font-weight:700">—</span>
      <span class="avatar-edit" aria-hidden="true">
        <span class="material-symbols-outlined" id="avatar-edit-icon" style="font-size:18px">add_a_photo</span>
      </span>
    </div>
    <input type="file" id="avatar-input" accept="image/png, image/jpeg, image/gif, image/webp" class="hidden"/>

    <h2 class="t-headline-md" id="profile-name" style="margin:0">—</h2>
    <p class="t-body-sm muted" id="profile-email" style="margin:0">—</p>

    <div class="row" style="gap:6px">
      <span class="pill pill-lilac" id="profile-mode">
        <span class="material-symbols-outlined filled" style="font-size:15px">spa</span>
        <span>—</span>
      </span>
    </div>
    <p class="t-body-sm muted" id="profile-since" style="margin:0"></p>
  </section>

  <!-- Change password -->
  <section class="card stack gap-xs">
    <div class="row gap-xs" style="color:var(--primary)">
      <span class="material-symbols-outlined filled" style="font-size:20px">lock</span>
      <h3 class="t-headline-sm" style="margin:0">Change Password</h3>
    </div>
    <p class="t-body-sm muted" style="margin:0">
      At least 8 characters, combining letters, numbers, and special characters.
      Other devices will be signed out.
    </p>

    <form id="password-form" class="stack gap-xs" novalidate>
      <div class="field">
        <label for="current-password">Current Password</label>
        <div class="field-input-wrap">
          <span class="material-symbols-outlined">lock</span>
          <input class="input with-icon" id="current-password" type="password" autocomplete="current-password" style="padding-right:2.75rem"/>
          <button class="icon-btn" id="toggle-current-password" type="button" aria-label="Toggle password visibility" style="position:absolute; right:4px; width:36px; height:36px">
            <span class="material-symbols-outlined" id="current-eye-icon" style="font-size:20px">visibility</span>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="new-password">New Password</label>
        <div class="field-input-wrap">
          <span class="material-symbols-outlined">key</span>
          <input class="input with-icon" id="new-password" type="password" autocomplete="new-password" minlength="8" style="padding-right:2.75rem"/>
          <button class="icon-btn" id="toggle-new-password" type="button" aria-label="Toggle password visibility" style="position:absolute; right:4px; width:36px; height:36px">
            <span class="material-symbols-outlined" id="new-eye-icon" style="font-size:20px">visibility</span>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="confirm-password">Confirm New Password</label>
        <div class="field-input-wrap">
          <span class="material-symbols-outlined">key</span>
          <input class="input with-icon" id="confirm-password" type="password" autocomplete="new-password" style="padding-right:2.75rem"/>
        </div>
      </div>
      <p class="t-body-sm" id="password-error" style="color:var(--error); margin:0"></p>
      <button class="btn btn-primary btn-block" id="btn-save-password" type="submit" style="padding-block:1rem">
        <span>Update Password</span>
        <span class="material-symbols-outlined" style="font-size:18px">check_circle</span>
      </button>
    </form>
  </section>
</main>

<div class="toast" role="status"></div>
<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
