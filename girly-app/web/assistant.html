<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Girly - Cycle Assistant</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="css/girly.css"/>
  <style>
    /* Chat layout: full-height page, only the messages scroll — the input
       dock stays fixed at the bottom of the screen. */
    html, body { height: 100%; overflow: hidden; }
    main.page { height: 100dvh; overflow: hidden; }
    .chat-stream {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 2px var(--sp-xs);
      margin: 0 calc(-1 * var(--sp-xs));
    }
    /* The footer (toggle + input dock) keeps its natural size — the stream
       gives up space instead, so the input is never clipped or pushed under
       the bottom nav. Only on absurdly short screens does it scroll inside
       itself. */
    .chat-footer {
      flex: 0 0 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    /* Suggested questions live in a bottom-sheet overlay (girly.css .sheet),
       so all six are visible on any screen without squeezing the input. */
    .sheet .prompt-chip {
      width: 100%;
      justify-content: flex-start;
      font-size: 12px;
      padding: 0.625rem 0.875rem;
    }
    /* Short screens (landscape phones): tighten the chrome so the toggle and
       the whole dock still fit. */
    @media (max-height: 700px) {
      main.page { gap: var(--sp-sm); padding-top: calc(4rem + var(--sp-sm)); }
    }
    @media (max-height: 560px) {
      main.page { gap: var(--sp-xs); padding-top: calc(4rem + var(--sp-xs)); padding-bottom: 5.5rem; }
      .chat-dock { padding: 6px; }
      /* two columns so all six questions fit landscape phones without scrolling */
      #prompt-chips { display: grid; grid-template-columns: repeat(2, 1fr); }
      /* the disclaimer returns as soon as there's room for it */
      #chat-disclaimer { display: none; }
    }
  </style>
</head>
<body>
<main class="page" style="gap:var(--sp-md); max-width:600px">

  <!-- Chat stream -->
  <div class="chat-stream" id="chat-stream"></div>

  <!-- Footer: suggested-questions toggle + input dock -->
  <div class="chat-footer stack gap-xs">

    <!-- Opens the suggested-questions sheet -->
    <div class="stack gap-xs" style="padding-top:var(--sp-xs)">
      <button class="btn btn-soft" id="suggest-toggle" type="button"
              style="width:100%; min-height:40px; padding:.375rem .75rem; justify-content:space-between"
              aria-expanded="false" aria-controls="suggest-backdrop">
        <span class="row gap-xs" style="min-width:0">
          <span class="material-symbols-outlined" style="font-size:17px">psychology</span>
          <span class="t-label-sm" id="suggest-label" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap">Suggested questions</span>
        </span>
        <span class="material-symbols-outlined" id="suggest-caret" style="font-size:18px">expand_more</span>
      </button>
    </div>

    <!-- Chat dock -->
    <div class="chat-dock stack gap-xs">
      <div class="attachment-tray" id="attachment-tray"></div>
      <form class="chat-input-row" id="chat-form">
        <button class="icon-btn" type="button" id="btn-attach" aria-label="Attach a photo or document"
                style="width:40px;height:40px;background:var(--surface-container-low)" title="Attach a photo or document">
          <span class="material-symbols-outlined" style="font-size:20px">add_circle</span>
        </button>
        <input type="file" id="attachment-input" class="hidden" multiple
               accept="image/png, image/jpeg, image/gif, image/webp, .pdf, .txt, .md, .doc, .docx"/>
        <textarea class="chat-input" id="chat-input" rows="1" autocomplete="off"
                  placeholder="Ask anything about periods, hygiene, or cramps..."></textarea>
        <button class="send-btn" id="send-button" type="submit" aria-label="Send message">
          <span class="material-symbols-outlined" style="font-size:20px">send</span>
        </button>
      </form>
      <div class="row" id="chat-disclaimer" style="justify-content:center; gap:4px; padding-inline:var(--sp-xs); padding-top:2px">
        <span class="material-symbols-outlined" style="color:var(--outline); font-size:14px">shield</span>
        <span class="t-label-sm" style="color:var(--outline)">Girly provides educational insights and is not a medical diagnosis.</span>
      </div>
    </div>

  </div>
</main>

<!-- Suggested questions sheet: an overlay, so all questions fit any screen -->
<div class="sheet-backdrop" id="suggest-backdrop">
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Suggested questions">
    <div class="sheet-handle"></div>
    <div class="row-between" style="padding:0 var(--sp-xs) var(--sp-sm)">
      <span class="t-label-sm" style="font-weight:700; color:var(--on-surface-variant)">Suggested questions</span>
      <button class="icon-btn" id="suggest-close" type="button" aria-label="Close suggested questions"
              style="width:32px;height:32px;background:var(--surface-container)">
        <span class="material-symbols-outlined" style="font-size:18px">close</span>
      </button>
    </div>
    <div class="stack gap-xs" id="prompt-chips" style="max-height:60dvh; overflow-y:auto; padding:2px var(--sp-xs) var(--sp-xs)"></div>
  </div>
</div>

<div class="toast" role="status"></div>
<script src="js/api.js"></script>
<script src="js/assistant.js"></script>
</body>
</html>
