<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Girly - Cycle Assistant</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link rel="stylesheet" href="css/girly.css"/>
  <style>
    /* Chat layout: full-height page, only the messages scroll — the input
       dock stays fixed at the bottom of the screen. */
    html, body { height: 100%; overflow: hidden; }
    main.page { height: 100dvh; overflow: hidden; }
    .chat-stream {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 2px var(--sp-xs);
      margin: 0 calc(-1 * var(--sp-xs));
    }
    /* The footer (clear button + input dock) keeps its natural size — the
       stream gives up space instead, so the input is never clipped or pushed
       under the bottom nav. Only on absurdly short screens does it scroll
       inside itself. */
    .chat-footer {
      flex: 0 0 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    /* Short screens (landscape phones): tighten the chrome so the whole dock
       still fits. */
    @media (max-height: 700px) {
      main.page { gap: var(--sp-sm); padding-top: calc(4rem + var(--sp-sm)); }
    }
    @media (max-height: 560px) {
      main.page { gap: var(--sp-xs); padding-top: calc(4rem + var(--sp-xs)); padding-bottom: 5.5rem; }
      .chat-dock { padding: 6px; }
      /* the disclaimer returns as soon as there's room for it */
      #chat-disclaimer { display: none; }
    }
  </style>
</head>
<body>
<main class="page" style="gap:var(--sp-md); max-width:600px">

  <!-- Chat stream -->
  <div class="chat-stream" id="chat-stream"></div>

  <!-- Footer: input dock -->
  <div class="chat-footer stack gap-xs">

    <!-- Revealed by assistant.js once there is a saved conversation. -->
    <div class="row gap-xs" style="padding-top:var(--sp-xs); justify-content:flex-end">
      <button class="icon-btn hidden" id="btn-clear-chat" type="button"
              aria-label="Clear your conversation" title="Clear your conversation"
              style="width:40px;height:40px;background:var(--surface-container-low)">
        <span class="material-symbols-outlined" style="font-size:20px">delete_sweep</span>
      </button>
    </div>

    <!-- Chat dock -->
    <div class="chat-dock stack gap-xs">
      <div class="attachment-tray" id="attachment-tray"></div>
      <form class="chat-input-row" id="chat-form">
        <button class="icon-btn" type="button" id="btn-attach" aria-label="Attach a photo or document"
                style="width:40px;height:40px;background:var(--surface-container-low)" title="Attach a photo or document">
          <span class="material-symbols-outlined" style="font-size:20px">add_circle</span>
        </button>
        <input type="file" id="attachment-input" class="hidden" multiple
               accept="image/png, image/jpeg, image/gif, image/webp, .pdf, .txt, .md, .doc, .docx"/>
        <!-- Dictation takes the send button's place, so there is only ever one
             round button: a mic until you type, then send. Hidden by
             assistant.js where the browser has no speech engine (Firefox), and
             there the send button above stays put. -->
        <textarea class="chat-input" id="chat-input" rows="1" autocomplete="off"
                  placeholder="Ask anything about periods, hygiene, or cramps..."></textarea>
        <button class="send-btn" id="send-button" type="submit" aria-label="Send message">
          <span class="material-symbols-outlined" style="font-size:20px">send</span>
        </button>
        <button class="send-btn hidden" type="button" id="btn-mic" aria-label="Dictate your question"
                aria-pressed="false" title="Dictate your question">
          <span class="material-symbols-outlined" id="btn-mic-icon" style="font-size:20px">mic</span>
        </button>
      </form>
      <div class="row" id="chat-disclaimer" style="justify-content:center; gap:4px; padding-inline:var(--sp-xs); padding-top:2px">
        <span class="material-symbols-outlined" style="color:var(--outline); font-size:14px">shield</span>
        <span class="t-label-sm" style="color:var(--outline)">Girly provides educational insights and is not a medical diagnosis.</span>
      </div>
    </div>

  </div>
</main>

<div class="toast" role="status"></div>
<script src="js/api.js"></script>
<script src="js/assistant.js"></script>
</body>
</html>
